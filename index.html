<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferência Carga - Expedição & Inspeção Lácteos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    .watermark-canvas { display: none; }
    #interactive video { width: 100%; height: 100%; object-fit: cover; }
    
    /* Animação suave de Fade In para a Splash Screen */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(1.05); }
      to { opacity: 1; transform: scale(1); }
    }
    .splash-fade {
      animation: fadeIn 3.5s ease-in-out forwards;
    }

    @media print {
      body { background: white; color: black; }
      header, button, #modal_scanner, #modal_camera_foto, #splash_screen { display: none !important; }
      .no-print { display: none !important; }
      .shadow, .border { box-shadow: none !important; }
    }
  </style>
</head>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conferência de Carga - Tirol</title>

  <!-- PWA & Favicon Metadata -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="icone_512.png">
  <link rel="apple-touch-icon" href="icone_arredondado_512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tirol Cargas">
  <meta name="theme-color" content="#1e3a8a">

  <!-- Tailwind CSS & Libraries CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen pb-12">

  <!-- Header principal -->
  <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <img src="icone_arredondado_512.png" alt="Logo App" class="w-10 h-10 rounded-lg shadow">
      <div>
        <h1 class="text-lg font-bold leading-tight">Conferência Carga</h1>
        <p class="text-xs text-blue-200">Expedição & Qualidade</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button id="btnTransmitir" onclick="transmitirParaSupabase()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-3 py-2 rounded shadow transition flex items-center space-x-1">
        <span>⚡ Transmitir</span>
      </button>
      <button onclick="salvarRascunhoLocal()" class="bg-blue-700 hover:bg-blue-600 text-white text-xs font-semibold px-3 py-2 rounded shadow transition">
        💾 Salvar
      </button>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Painel Conexão Supabase -->
    <section class="bg-slate-900 text-white p-4 rounded-xl shadow-md border border-slate-700">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold flex items-center gap-2">
          ⚙️ Conexão em Tempo Real (Supabase)
        </h2>
        <span id="statusConexao" class="text-xs px-2 py-1 rounded-full bg-yellow-500/20 text-yellow-300 font-medium">
          ● Não Conectado
        </span>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-300 mb-1">URL do Supabase:</label>
          <input type="password" id="supabaseUrl" placeholder="https://xyz.supabase.co" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-400">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">Chave Anon Public:</label>
          <input type="password" id="supabaseKey" placeholder="Cole a chave eyJhbG... aqui" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-400">
        </div>
        <button onclick="conectarEProteger()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded text-xs shadow transition">
          Conectar & Proteger Chaves
        </button>
      </div>
    </section>

    <!-- 1. Dados da Carga / Veículo -->
    <section class="bg-white p-5 rounded-xl shadow border border-gray-200">
      <h2 class="text-base font-bold text-blue-900 mb-4 flex items-center gap-2">
        🚚 1. Dados da Carga / Veículo
      </h2>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="col-span-2">
          <label class="block text-gray-600 mb-1">Operador / Conferente:</label>
          <input type="text" id="operador" placeholder="Seu nome" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Doc. Transporte (DT):</label>
          <input type="text" id="dt" placeholder="Ex: 300000290" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Placa Veículo:</label>
          <input type="text" id="placa" placeholder="ABC-1234" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none uppercase">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Transportadora:</label>
          <input type="text" id="transportadora" placeholder="Nome da empresa" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Turno:</label>
          <select id="turno" class="w-full border rounded p-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="1º Turno">1º Turno</option>
            <option value="2º Turno">2º Turno</option>
            <option value="3º Turno">3º Turno</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 2. Conferência de Etiqueta / Palete -->
    <section class="bg-white p-5 rounded-xl shadow border border-gray-200">
      <h2 class="text-base font-bold text-blue-900 mb-3 flex items-center gap-2">
        🏷️ 2. Conferência de Etiqueta / Palete
      </h2>
      <button onclick="escanearBarcode()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-xs shadow mb-3 flex items-center justify-center gap-2 transition">
        <span>📷 Escanear Etiqueta do Produto</span>
      </button>
      <div class="space-y-2 text-xs">
        <input type="text" id="itemMaterial" placeholder="Código Material" class="w-full border rounded p-2">
        <input type="text" id="itemDescricao" placeholder="Descrição do Produto" class="w-full border rounded p-2">
        <div class="grid grid-cols-3 gap-2">
          <input type="text" id="itemLote" placeholder="Lote" class="border rounded p-2">
          <input type="text" id="itemValidade" placeholder="Validade" class="border rounded p-2">
          <input type="number" id="itemQtd" placeholder="Qtd" class="border rounded p-2">
        </div>
        <button onclick="adicionarItemConferido()" class="w-full bg-blue-900 text-white py-2 rounded text-xs font-semibold hover:bg-blue-800 transition">
          + Adicionar Item à Lista
        </button>
      </div>

      <div id="listaItens" class="mt-4 space-y-2 max-h-40 overflow-y-auto text-xs"></div>
    </section>

    <!-- 3. Inspeção e Temperaturas -->
    <section class="bg-white p-5 rounded-xl shadow border border-gray-200">
      <h2 class="text-base font-bold text-blue-900 mb-3 flex items-center gap-2">
        🌡️ 3. Inspeção & Temperaturas
      </h2>
      <p class="text-xs text-gray-500 mb-3">Limite crítico de temperatura: máx 7,0°C.</p>

      <div class="grid grid-cols-2 gap-3 text-xs mb-4">
        <div>
          <label class="block text-gray-600 mb-1">Temp. Início (°C):</label>
          <input type="number" step="0.1" id="tempInicio" onchange="validarTemperatura()" placeholder="0.0" class="w-full border rounded p-2">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Temp. Meio (°C):</label>
          <input type="number" step="0.1" id="tempMeio" onchange="validarTemperatura()" placeholder="0.0" class="w-full border rounded p-2">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Temp. Fim (°C):</label>
          <input type="number" step="0.1" id="tempFim" onchange="validarTemperatura()" placeholder="0.0" class="w-full border rounded p-2">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Temp. Veículo (°C):</label>
          <input type="number" step="0.1" id="tempVeiculo" placeholder="0.0" class="w-full border rounded p-2">
        </div>
      </div>

      <div class="border-t pt-3 space-y-2 text-xs">
        <label class="block font-semibold text-gray-700">Parecer Final:</label>
        <select id="parecerFinal" class="w-full border rounded p-2 bg-white font-bold">
          <option value="Aprovado" class="text-green-600">Aprovado</option>
          <option value="Aprovado c/ restrição" class="text-yellow-600">Aprovado c/ Restrição</option>
          <option value="Reprovado" class="text-red-600">Reprovado</option>
        </select>
      </div>
    </section>

    <!-- 4. Evidências Fotográficas e Compartilhamento -->
    <section class="bg-white p-5 rounded-xl shadow border border-gray-200 text-xs">
      <h2 class="text-base font-bold text-blue-900 mb-3 flex items-center gap-2">
        📸 4. Evidências & Relatório
      </h2>
      <div class="space-y-3">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="processarFoto(event)">
        <button onclick="document.getElementById('cameraInput').click()" class="w-full bg-slate-800 text-white py-2.5 rounded-lg font-medium flex items-center justify-center gap-2 hover:bg-slate-700 transition">
          📷 Capturar Foto c/ Carimbo de Data/Hora
        </button>
        <div id="galeriaFotos" class="grid grid-cols-3 gap-2 pt-2"></div>
      </div>

      <div class="border-t mt-4 pt-4 space-y-2">
        <button onclick="exportarExcel()" class="w-full bg-green-700 text-white py-2.5 rounded-lg font-semibold hover:bg-green-600 transition flex items-center justify-center gap-2">
          📊 Exportar Relatório em Excel (.xlsx)
        </button>
        <button onclick="compartilharWhatsApp()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-500 transition flex items-center justify-center gap-2">
          💬 Compartilhar via WhatsApp
        </button>
      </div>
    </section>

  </main>

  <script>
    // Registro do Service Worker para suporte PWA Offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW falhou:', err));
      });
    }

    let supabaseClient = null;

    function conectarEProteger() {
      const url = document.getElementById('supabaseUrl').value;
      const key = document.getElementById('supabaseKey').value;

      if (!url || !key) {
        alert('Por favor, informe a URL e a Chave do Supabase.');
        return;
      }

      try {
        supabaseClient = supabase.createClient(url, key);
        document.getElementById('statusConexao').className = 'text-xs px-2 py-1 rounded-full bg-green-500/20 text-green-300 font-medium';
        document.getElementById('statusConexao').innerText = '● Conectado';
        localStorage.setItem('sp_url', url);
        localStorage.setItem('sp_key', key);
        alert('Conexão com Supabase estabelecida com sucesso!');
      } catch (e) {
        alert('Erro ao conectar com Supabase: ' + e.message);
      }
    }

    function validarTemperatura() {
      const tInic = parseFloat(document.getElementById('tempInicio').value) || 0;
      const tMeio = parseFloat(document.getElementById('tempMeio').value) || 0;
      const tFim = parseFloat(document.getElementById('tempFim').value) || 0;

      if (tInic > 7.0 || tMeio > 7.0 || tFim > 7.0) {
        document.getElementById('parecerFinal').value = 'Aprovado c/ restrição';
        alert('Atenção: Temperatura registrada acima do limite máximo de 7.0°C! Parecer alterado automaticamente.');
      }
    }

    function salvarRascunhoLocal() {
      const dados = {
        operador: document.getElementById('operador').value,
        dt: document.getElementById('dt').value,
        placa: document.getElementById('placa').value,
        transportadora: document.getElementById('transportadora').value,
        parecer: document.getElementById('parecerFinal').value
      };
      localStorage.setItem('rascunho_carga', JSON.stringify(dados));
      alert('Rascunho salvo localmente com sucesso!');
    }

    // Carregar configurações guardadas
    window.onload = function() {
      if (localStorage.getItem('sp_url') && localStorage.getItem('sp_key')) {
        document.getElementById('supabaseUrl').value = localStorage.getItem('sp_url');
        document.getElementById('supabaseKey').value = localStorage.getItem('sp_key');
        conectarEProteger();
      }
    };
  </script>
</body>
</html>

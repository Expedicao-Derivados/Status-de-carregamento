<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferência Carga - Expedição & Inspeção Lácteos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    .watermark-canvas { display: none; }
    #interactive video { width: 100%; height: 100%; object-fit: cover; }
    @media print {
      body { background: white; color: black; }
      header, button, #modal_scanner, #modal_camera_foto { display: none !important; }
      .no-print { display: none !important; }
      .shadow, .border { box-shadow: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

  <!-- Header -->
  <header class="bg-blue-900 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg flex items-center gap-2">
        <span>🥛</span> Conferência Carga
      </h1>
      <button onclick="abrirConfigSupabase()" class="bg-blue-800 hover:bg-blue-700 text-xs px-2 py-1 rounded border border-blue-600">
        ⚙️ Supabase
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6" id="conteudo_principal">

    <!-- 1. IDENTIFICAÇÃO DA CARGA -->
    <section class="bg-white p-4 rounded-xl shadow border border-gray-200">
      <h2 class="font-bold text-blue-900 text-md mb-3 flex items-center gap-2">
        <span>🚛</span> 1. Dados da Carga / Veículo
      </h2>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block font-semibold mb-1">Operador / Conferente</label>
          <input type="text" id="op_nome" placeholder="Seu nome" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
